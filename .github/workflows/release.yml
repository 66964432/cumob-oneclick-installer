name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PowerShell image fallback
        shell: powershell
        run: |
          $result = .\payload\generate-image.ps1 `
            --base-url https://api.cumob.com/v1 `
            --image-api images `
            --image-model gpt-image-2 `
            --prompt "Release configuration check" `
            --out "$env:TEMP\cumob-release-unused.png" `
            --dry-run `
            --no-progress | ConvertFrom-Json
          if ($result.endpoint -ne "https://api.cumob.com/v1/images/generations") { throw "Unexpected image endpoint" }
          if ($result.image_model -ne "gpt-image-2") { throw "Unexpected image model" }

      - name: Run Windows installer tests
        shell: pwsh
        run: .\tests\test-install.ps1

  release:
    needs: test-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run installer tests
        run: bash tests/test-install.sh

      - name: Build release artifacts
        run: bash build-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cumob-oneclick-installer.zip
            dist/bootstrap-entry.zip
            dist/install-macos.command
            dist/install-windows.cmd
            MANIFEST.sha256
          generate_release_notes: true
